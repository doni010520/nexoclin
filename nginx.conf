server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # equivalente a "cleanUrls" + rewrites do vercel.json
  location = /plataforma { try_files /nexoclin.html =404; }
  location = /app        { try_files /nexoclin.html =404; }

  # headers declarados no vercel.json
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # marcador para saber qual ambiente respondeu
  location = /_env { default_type text/plain; return 200 "nexoclin-dev (VPS liriel)\n"; }

  location / { try_files $uri $uri.html $uri/ =404; }
}
